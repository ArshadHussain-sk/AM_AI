version: '3.8'

services:
  web:
    build: .
    container_name: am_ai_separator
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./am_ai.db:/app/am_ai.db
    environment:
      - SESSION_SECRET_KEY=am_ai_production_secret_key_change_me_in_prod
    restart: always
